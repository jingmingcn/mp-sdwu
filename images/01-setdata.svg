<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- 1. 调用 setData() -->
  <rect x="240" y="40" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">调用 setData()</text>

  <!-- Arrow down -->
  <line x1="360" y1="96" x2="360" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. 逻辑层更新 this.data -->
  <rect x="200" y="140" width="320" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="174" text-anchor="middle" font-size="16" font-weight="600" fill="#166534">逻辑层更新 this.data</text>

  <!-- Split -->
  <line x1="360" y1="196" x2="360" y2="230" stroke="#374151" stroke-width="1.5"/>
  <line x1="160" y1="230" x2="560" y2="230" stroke="#374151" stroke-width="1.5"/>
  <line x1="160" y1="230" x2="160" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="230" x2="560" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#6b7280">同步更新 + 异步渲染</text>

  <!-- Left branch: 读取 this.data -->
  <rect x="40" y="270" width="240" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">读取 this.data</text>
  <text x="160" y="322" text-anchor="middle" font-size="14" fill="#92400e">可以获得新值</text>

  <!-- Right branch: 跨层传递数据 -->
  <rect x="440" y="270" width="240" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="304" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">跨层传递数据</text>

  <line x1="560" y1="326" x2="560" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 渲染层处理 -->
  <rect x="440" y="370" width="240" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="404" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">渲染层处理</text>

  <line x1="560" y1="426" x2="560" y2="470" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 界面更新完成 -->
  <rect x="440" y="470" width="240" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">界面更新完成</text>

  <line x1="560" y1="526" x2="560" y2="570" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 执行 callback -->
  <rect x="440" y="570" width="240" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="604" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">执行 callback</text>
</svg>