<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <!-- 背景 -->
  <rect width="860" height="520" fill="#fafbfc" rx="12"/>
  
  <!-- 标题 -->
  <text x="430" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">3.3 应用与页面生命周期</text>
  
  <!-- 左侧 App 级 标题 -->
  <rect x="40" y="60" width="280" height="36" rx="6" fill="#07c160"/>
  <text x="180" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#fff">App 级</text>
  
  <!-- 右侧 Page 级 标题 -->
  <rect x="480" y="60" width="340" height="36" rx="6" fill="#1989fa"/>
  <text x="650" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#fff">Page 级</text>
  
  <!-- App 级节点 -->
  <!-- onLaunch -->
  <rect x="70" y="120" width="220" height="40" rx="8" fill="#fff" stroke="#07c160" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#07c160">onLaunch</text>
  <text x="180" y="175" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（全局仅一次）</text>
  
  <!-- onShow -->
  <rect x="70" y="210" width="220" height="40" rx="8" fill="#fff" stroke="#07c160" stroke-width="2"/>
  <text x="180" y="235" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#07c160">onShow</text>
  <text x="180" y="265" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（每次前台）</text>
  
  <!-- onHide -->
  <rect x="70" y="320" width="220" height="40" rx="8" fill="#fff" stroke="#07c160" stroke-width="2"/>
  <text x="180" y="345" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#07c160">onHide</text>
  <text x="180" y="375" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（每次后台）</text>
  
  <!-- 其他 App 事件 -->
  <text x="180" y="420" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#999">onError / onPageNotFound</text>
  <text x="180" y="438" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#999">onUnhandledRejection</text>
  
  <!-- Page 级节点 -->
  <!-- onLoad -->
  <rect x="520" y="120" width="260" height="40" rx="8" fill="#fff" stroke="#1989fa" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1989fa">onLoad</text>
  <text x="650" y="175" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（页面仅一次，拿到 query）</text>
  
  <!-- onShow -->
  <rect x="520" y="200" width="260" height="40" rx="8" fill="#fff" stroke="#1989fa" stroke-width="2"/>
  <text x="650" y="225" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1989fa">onShow</text>
  <text x="650" y="255" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（每次可见）</text>
  
  <!-- onReady -->
  <rect x="520" y="280" width="260" height="40" rx="8" fill="#fff" stroke="#1989fa" stroke-width="2"/>
  <text x="650" y="305" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1989fa">onReady</text>
  <text x="650" y="335" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#666">（首次渲染完成）</text>
  
  <!-- 用户交互虚线框 -->
  <rect x="520" y="360" width="260" height="32" rx="6" fill="#f0f7ff" stroke="#1989fa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="650" y="381" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1989fa">─ 用户交互 ─</text>
  
  <!-- onHide -->
  <rect x="520" y="410" width="260" height="36" rx="8" fill="#fff" stroke="#1989fa" stroke-width="2"/>
  <text x="650" y="433" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1989fa">onHide</text>
  
  <!-- onUnload -->
  <rect x="520" y="460" width="260" height="36" rx="8" fill="#fff" stroke="#1989fa" stroke-width="2"/>
  <text x="650" y="483" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1989fa">onUnload</text>
  <text x="650" y="510" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666">（页面出栈销毁）</text>
  
  <!-- 连接箭头 App → Page -->
  <!-- onShow 连接线 -->
  <path d="M290 230 H 380 Q 420 230 420 200 V 145 H 520" fill="none" stroke="#07c160" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="400" y="175" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#07c160">触发</text>
  
  <!-- onHide 连接线 -->
  <path d="M290 340 H 380 Q 420 340 420 428 H 520" fill="none" stroke="#07c160" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Page 内部垂直箭头 -->
  <line x1="650" y1="160" x2="650" y2="200" stroke="#1989fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="650" y1="240" x2="650" y2="280" stroke="#1989fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="650" y1="320" x2="650" y2="360" stroke="#1989fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="650" y1="392" x2="650" y2="410" stroke="#1989fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="650" y1="446" x2="650" y2="460" stroke="#1989fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#07c160"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1989fa"/>
    </marker>
  </defs>
  
  <!-- 易错点提示框 -->
  <rect x="40" y="460" width="400" height="48" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="55" y="482" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#d46b08">
    <tspan font-weight="600">易错点：</tspan>onLoad 里调 createSelectorQuery() 拿不到节点
  </text>
  <text x="55" y="500" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#d46b08">
    → 此时还没渲染完，必须放在 onReady
  </text>
</svg>