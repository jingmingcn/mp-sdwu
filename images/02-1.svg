<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b">
    普通做法 vs WXS 做法
  </text>

  <!-- ========== 普通做法 ========== -->
  <rect x="40" y="70" width="820" height="200" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="60" y="100" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#dc2626">普通做法（2 次通信）</text>

  <!-- Boxes for normal -->
  <rect x="80" y="130" width="140" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#991b1b">渲染层</text>
  <text x="150" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">Render</text>

  <rect x="320" y="130" width="140" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#92400e">逻辑层</text>
  <text x="390" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">Logic</text>

  <rect x="560" y="130" width="140" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="630" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#991b1b">渲染层</text>
  <text x="630" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">Render</text>

  <!-- Arrows normal -->
  <line x1="220" y1="160" x2="310" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="265" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="600">事件</text>

  <line x1="460" y1="160" x2="550" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="505" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="600">setData</text>

  <!-- Communication note -->
  <text x="450" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">跨线程通信 × 2</text>

  <!-- ========== WXS 做法 ========== -->
  <rect x="40" y="300" width="820" height="180" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="60" y="330" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#16a34a">WXS 做法（0 次通信）</text>

  <!-- Boxes for WXS -->
  <rect x="150" y="360" width="140" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="220" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#166534">渲染层</text>
  <text x="220" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">Render</text>

  <rect x="380" y="360" width="140" height="60" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#14532d">WXS 计算</text>
  <text x="450" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#166534">in Render Layer</text>

  <rect x="610" y="360" width="140" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#166534">渲染层</text>
  <text x="680" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">Render</text>

  <!-- Arrows WXS -->
  <line x1="290" y1="390" x2="370" y2="390" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="390" x2="600" y2="390" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="450" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">同一线程 · 无跨层通信</text>

  <!-- ========== 说明 ========== -->
  <rect x="40" y="510" width="820" height="90" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="540" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">4.1 WXS 是什么</text>
  <text x="60" y="565" font-family="system-ui, sans-serif" font-size="14" fill="#334155">
    <tspan font-weight="600">WXS（WeiXin Script）</tspan> 是一套受限的脚本语言，代码被编译进
    <tspan font-weight="600" fill="#16a34a">渲染层</tspan>，可在 WXML 中直接调用。
  </text>
  <text x="60" y="585" font-family="system-ui, sans-serif" font-size="14" fill="#334155">
    意义：<tspan font-weight="600" fill="#16a34a">在不跨线程的前提下做计算</tspan>。
  </text>
</svg>